.insurance-footer{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;white-space:nowrap;padding:0 9px 8px 36px}
.insurance-footer>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:6.6px}
.insurance-footer .link{white-space:nowrap;font-size:6.6px;padding:1px 0}
.insurance-detail-sheet .sheet-head{font-size:10.5px;padding-top:7px;padding-bottom:7px}
.insurance-detail-sheet .sheet-body{padding:9px 11px 14px}
.insurance-detail-sheet h3{font-size:11px;line-height:1.25;margin:0 0 5px}
.insurance-detail-sheet p{font-size:7.8px;line-height:1.42}
.insurance-detail-sheet .terms-list{font-size:7.7px;line-height:1.48;padding-left:15px;margin:8px 0}
.insurance-provider{font-size:7px;line-height:1;white-space:nowrap;margin-top:8px}
.insurance-detail-sheet .disclaimer{font-size:6.8px;line-height:1.4;padding:8px 9px;margin-top:8px}

/* v6 refinements: fix oversized fallback text and make fare selection flow explicit */
.form-subtitle{margin:2px 9px 5px;color:#2a3d5a;font-size:8.2px;font-weight:850;line-height:1.3}
.compare-note{margin-top:8px;padding:7px 8px;border-radius:8px;background:#f3f8ff;color:#405675;font-size:7.4px;line-height:1.45}
.baggage-options{display:grid;gap:7px;padding-top:2px}
.bag-option{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.bag-option:first-child{border-top:0}
.bag-option>div{min-width:0}
.bag-option strong{display:block;font-size:8.7px;line-height:1.25;color:var(--ink)}
.bag-option small{display:block;margin-top:2px;color:var(--muted);font-size:7.1px;line-height:1.35}
.bag-option .option-price{font-size:8.3px;white-space:nowrap}
.bag-radio{width:26px;height:26px;border:1.5px solid #b7c3d6;border-radius:8px;background:#fff;color:transparent;font-size:11px;font-weight:900}
.bag-radio.selected{border-color:var(--blue);background:var(--blue);color:#fff}
.fare-continue-bar{position:sticky;bottom:-18px;z-index:4;margin:10px -11px -18px;padding:9px 11px 12px;background:linear-gradient(180deg,rgba(255,255,255,.88),#fff 28%);border-top:1px solid #e5ebf3;display:flex;align-items:center;gap:10px}
.fare-continue-copy{flex:1;min-width:0}
.fare-continue-copy span{display:block;color:var(--muted);font-size:7px}
.fare-continue-copy b{display:block;margin-top:2px;color:var(--ink);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fare-continue-btn{height:38px;min-width:116px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:9.5px;font-weight:900}


/* v8: compact voucher chooser + always-expanded fare details */
.voucher-sheet .sheet-body{padding:10px 11px 16px}
.voucher-list{display:grid;gap:8px}
.voucher-option{border:1px solid #dfe6f0;border-radius:11px;background:#fff;padding:9px 10px}
.voucher-option.active{border-color:var(--blue);background:#f5f8ff;box-shadow:inset 0 0 0 1px var(--blue)}
.voucher-option-top{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:start}
.voucher-ticket{width:26px;height:26px;border-radius:8px;background:#eef4ff;color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:900}
.voucher-copy{min-width:0}
.voucher-copy strong{display:block;color:var(--ink);font-size:9.2px;line-height:1.25}
.voucher-copy small{display:block;margin-top:3px;color:var(--muted);font-size:7.2px;line-height:1.35}
.voucher-save{color:var(--blue);font-size:9.7px;font-weight:900;white-space:nowrap}
.voucher-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
.voucher-actions span{min-width:0;color:#68778d;font-size:7px;line-height:1.3}
.voucher-actions button{height:27px;padding:0 10px;border:1px solid #c9d8ef;border-radius:8px;background:#fff;color:var(--blue);font-size:7.6px;font-weight:900;white-space:nowrap}
.voucher-actions button.active{border-color:#b7e6ca;background:#eafaf1;color:#087f49}
.fare-option .fare-expand-body{display:block;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);color:#54637a;font-size:7.4px;line-height:1.5}
.fare-option .fare-actions{justify-content:flex-end}
.compare-note{font-size:7.4px!important;line-height:1.45!important}
.compare-row .current-col{background:#eef4ff!important;color:var(--blue)!important}
.compare-row .upgrade-col{background:#ebfbf2!important;color:#087f49!important}


.recommend-reason{margin-top:7px;padding:6px 8px;border-radius:8px;background:#eafaf1;color:#087f49;font-size:10px;font-weight:700;line-height:1.35}
</style>
</head>

function flightMinutes(hhmm){const [h,m]=hhmm.split(':').map(Number);return h*60+m}
function visibleFlights(){return flights.filter(f=>state.selectedAirlines.includes(f.airlineKey))}
function recommendationMeta(list=visibleFlights()){
 if(!list.length)return {cheapestId:null,bestFitId:null};
 const minPrice=Math.min(...list.map(f=>f.base));
 const maxPrice=Math.max(...list.map(f=>f.base));
 const cheapestId=list.find(f=>f.base===minPrice)?.id;
 const target=18*60;
 const scored=list.map(f=>{
   const priceScore=maxPrice===minPrice?1:(maxPrice-f.base)/(maxPrice-minPrice);
   const timeScore=Math.max(0,1-Math.abs(flightMinutes(f.depart)-target)/180);
   return {...f,fitScore:.45*priceScore+.55*timeScore};
 });
 const bestFitId=scored.sort((a,b)=>b.fitScore-a.fitScore)[0]?.id;
 return {cheapestId,bestFitId};
}
function sortedFlights(){
 const arr=[...visibleFlights()];
 const rec=recommendationMeta(arr);
 if(state.sortMode==='priceAsc')return arr.sort((a,b)=>a.base-b.base);
 return arr.sort((a,b)=>{
   if(a.id===rec.bestFitId&&b.id!==rec.bestFitId)return -1;
   if(b.id===rec.bestFitId&&a.id!==rec.bestFitId)return 1;
   return a.base-b.base;
 });
}

function renderPayment(){const v=vouchers[state.selectedVoucher]||vouchers.NEW100;return `<div class="screen payment-bg">${header('Xác nhận giao dịch','',true)}<div class="content"><section class="merchant"><div class="merchant-row"><div class="merchant-logo">${airlineMark().code}</div><div class="merchant-copy"><strong>${flight().airline} · ${flight().code}</strong><small>Chuyến bay: SGN ${flight().depart} → HAN ${flight().arrive}<br>${fare().name} · 1 hành khách</small></div></div><div class="amount">${money(total())}</div><button class="order-detail" data-total-breakdown>▧ Chi tiết đơn hàng</button></section>${state.priceBreakdown?priceBreakdown():''}<section class="pay-card"><div class="pay-row"><div class="pay-icon">🪙</div><div class="pay-copy"><strong>Dùng ${flight().xu} xu</strong><small>Trừ trực tiếp vào giá trị thanh toán</small></div><button class="switch ${state.useXu?'on':''}" data-toggle-xu></button></div><div class="pay-row promo-applied"><div class="pay-icon">%</div><div class="pay-copy"><strong>${state.voucher?'Ưu đãi đang áp dụng':'Chưa áp dụng ưu đãi'}</strong><small class="${state.voucher?'applied-voucher-name':''}">${state.voucher?`${v.name} · ${v.short}`:'Chọn voucher phù hợp với đơn hàng'}</small></div><button class="row-action" data-open-vouchers>${state.voucher?'Xem / Đổi':'Chọn voucher'}</button></div></section>${state.insurance?`<section class="pay-card"><div class="pay-row"><div class="pay-icon">🛡</div><div class="pay-copy"><strong>${state.insurance==='delay'?'Bảo hiểm trễ huỷ':'Bảo hiểm du lịch'}</strong><small>BẢO VIỆT · gói đã chọn</small></div><b style="font-size:9px">${money(insurancePrice())}</b></div></section>`:''}<section class="pay-card"><div class="method-head"><h3>Tài khoản / Thẻ</h3><button class="link">Xem tất cả</button></div><div class="methods">${paymentMethod('vcb','VCB','Vietcombank','•••• 8015','')}${paymentMethod('wallet','ZP','Tài khoản trả sau','Mua trước, trả sau','zp')}${paymentMethod('card','VISA','Thẻ quốc tế','•••• 2048','')}</div></section><section class="pay-card"><div class="pay-row"><div class="pay-icon">▣</div><div class="pay-copy"><strong>Thông tin liên hệ</strong><small>${state.contact.email} · ${state.contact.phone}</small></div></div><div class="pay-row"><div class="pay-icon">▤</div><div class="pay-copy"><strong>Xuất hoá đơn VAT</strong><small>Chỉ được gửi yêu cầu tại bước thanh toán</small></div><button class="row-action">Yêu cầu</button></div></section><div class="legal">Bằng cách nhấn Xác nhận, bạn đồng ý với điều khoản dịch vụ, chính sách quyền riêng tư và cho phép ZaloPay chia sẻ thông tin cần thiết để xử lý đơn hàng.</div></div><div class="bottom-cta"><button class="total" style="border:0;background:transparent;text-align:left" data-total-breakdown><span>Tổng thanh toán ˄</span><strong>${money(total())}</strong><s>${money(oldFarePrice()+addonPrice()+insurancePrice())}</s><span class="coin">🪙 +${flight().xu} xu</span></button><button class="cta green" data-pay-success>✓ Xác nhận</button></div>${renderModal()}${loadingOverlay()}</div>`}
function paymentMethod(key,badge,title,meta,klass){const sel=state.paymentMethod===key;return `<button class="method ${sel?'active':''}" data-method="${key}"><span class="method-badge ${klass}">${badge}</span><strong>${title}</strong><small>${meta}</small>${sel?'<span class="method-check">✓</span>':''}</button>`}
function priceBreakdown(){return `<section class="pay-card breakdown"><div class="break-row"><span>Giá vé</span><b>${money(farePrice())}</b></div><div class="break-row"><span>Dịch vụ bổ sung</span><b>${money(addonPrice())}</b></div><div class="break-row"><span>Bảo hiểm</span><b>${money(insurancePrice())}</b></div><div class="break-row"><span>Voucher</span><b style="color:#087f49">-${money(discount())}</b></div>${state.useXu?`<div class="break-row"><span>ZaloPay xu</span><b style="color:#087f49">-${money(xuDiscount())}</b></div>`:''}<div class="break-row total"><span>Tổng thanh toán</span><b>${money(total())}</b></div></section>`}
function renderSuccess(){return `<div class="screen">${status()}<div class="success"><div class="success-box"><div class="success-mark">✓</div><h2>Thanh toán thành công</h2><p>Vé đã được xác nhận. Thông tin chuyến bay đã gửi qua email và lưu trong mục Vé của tôi.</p><div class="success-card"><strong>TP Hồ Chí Minh → Hà Nội · ${flight().code}</strong><small>${flight().depart}–${flight().arrive} · ${fare().name}<br>Hành khách: LE NGUYEN KHANH DOAN<br>Đã thanh toán: ${money(total())}</small></div><div class="success-actions"><button class="primary" data-view-ticket>Xem vé của tôi</button><button class="secondary" data-reset>Về Vé máy bay</button></div></div></div></div>`}
function renderModal(){if(!state.modal)return'';if(state.modal==='fare')return fareSheet();if(state.modal==='ticket')return ticketDetailSheet();if(state.modal==='seat')return seatMapSheet();if(state.modal==='confirm')return confirmSheet();if(state.modal==='insurance')return insuranceSheet();if(state.modal==='voucher')return voucherSheet();if(state.modal==='exit')return retentionSheet();if(state.modal==='think')return thinkSheet();if(state.modal==='breakdown')return `<div class="sheet-wrap"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head">Chi tiết tạm tính<button class="sheet-close" data-close-sheet>×</button></div><div class="sheet-body">${priceBreakdown()}</div></div></div>`;return''}
function fareSheet(){return `<div class="sheet-wrap fare-sheet"><div class="sheet" data-draggable-sheet><div class="sheet-handle" data-sheet-handle></div><div class="sheet-head">Chọn hạng vé<button class="sheet-close" data-close-sheet>×</button></div><div class="sheet-body"><div class="sheet-summary"><strong>SGN ${flight().depart} → HAN ${flight().arrive}</strong><small>${flight().airline} · ${flight().code} · Bay thẳng</small></div><div class="fare-list">${Object.entries(fares).map(([k,v])=>fareOption(k,v)).join('')}</div><button class="sheet-cta" style="background:#fff;color:var(--blue);border:1px solid #c9d8f5" data-compare-fares>${state.compareFares?'Ẩn so sánh':'So sánh hạng vé'}</button>${state.compareFares?compareGrid():''}<div class="fare-continue-bar"><div class="fare-continue-copy"><span>Hạng vé đang chọn</span><b>${fare().name} · ${money(farePrice())}</b></div><button class="fare-continue-btn" data-fare-continue>Tiếp tục</button></div></div></div></div>`}
function fareOption(k,v){const active=state.selectedFare===k;return `<article class="fare-option ${active?'selected':''}"><div class="fare-top"><div><div class="fare-name">${v.name} ${active?'<span class="selected-fare-label">Đã chọn</span>':''}</div><div class="fare-core">${v.cabin} · ${v.baggage}</div></div><div class="fare-price">${money(flight().base+v.delta)}</div></div><div class="fare-badges">${k==='deluxe'?'<span class="meta-tag" style="background:#eafaf1;color:#087f49">PHÙ HỢP NHẤT</span>':''}<span class="meta-tag">${v.meal}</span></div><div class="fare-expand-body"><b>Đổi vé:</b> ${v.change}<br><b>Hoàn / huỷ:</b> ${v.refund}<br><b>Hành lý:</b> ${v.cabin}; ${v.baggage}</div><div class="fare-actions"><button class="button-sm ${active?'selected-btn':''}" data-choose-fare="${k}">${active?'Đã chọn':'Chọn vé'}</button></div></article>`}
function compareGrid(){const keys=['eco','deluxe','sky'];const currentKey=state.selectedFare||'eco';const current=fares[currentKey];const deltaLabel=k=>{const d=fares[k].delta-current.delta;if(d===0)return 'Hiện tại · '+fares[k].name;return `${d>0?'+':'−'}${Math.round(Math.abs(d)/1000).toLocaleString('vi-VN')}K · ${fares[k].name}`};const note=currentKey==='eco'?'DELUXE chỉ thêm khoảng 109K nhưng có thêm 20kg hành lý ký gửi và điều kiện vé linh hoạt hơn ECO.':currentKey==='deluxe'?'Bạn đang chọn DELUXE. SKYBOSS thêm quyền lợi hành lý, suất ăn và điều kiện đổi vé linh hoạt hơn; ECO rẻ hơn nhưng ít quyền lợi hơn.':'Bạn đang chọn SKYBOSS — hạng có nhiều quyền lợi nhất. DELUXE tiết kiệm đáng kể nếu bạn không cần đầy đủ quyền lợi SKYBOSS.';return `<div class="compare-mode"><div class="compare-title"><strong>So sánh chênh lệch theo hạng đang chọn</strong><small>Giá và quyền lợi cập nhật theo lựa chọn hiện tại.</small></div><div class="compare-table"><div class="compare-row head"><span></span>${keys.map(k=>`<b class="${k===currentKey?'current-col':k==='deluxe'?'upgrade-col':''}">${deltaLabel(k)}</b>`).join('')}</div><div class="compare-row"><span>Ký gửi</span>${keys.map(k=>`<em>${fares[k].baggage}</em>`).join('')}</div><div class="compare-row"><span>Đổi vé</span>${keys.map(k=>`<em>${fares[k].change}</em>`).join('')}</div><div class="compare-row"><span>Hoàn / huỷ</span>${keys.map(k=>`<em>${fares[k].refund}</em>`).join('')}</div><div class="compare-row"><span>Suất ăn</span>${keys.map(k=>`<em>${fares[k].meal}</em>`).join('')}</div></div><div class="compare-note">${note}</div></div>`}
function fareCompareStrip(){const k=state.selectedFare||'eco';if(k==='eco')return `<div class="detail-compare-strip"><span>Nâng lên DELUXE</span><b>+${money(fares.deluxe.delta-fares.eco.delta)} · thêm 20kg ký gửi + điều kiện vé tốt hơn</b></div>`;if(k==='deluxe')return `<div class="detail-compare-strip"><span>Nâng lên SKYBOSS</span><b>+${money(fares.sky.delta-fares.deluxe.delta)} · 30kg ký gửi + suất ăn + đổi vé linh hoạt</b></div>`;return `<div class="detail-compare-strip"><span>Hạng đang chọn</span><b>SKYBOSS · quyền lợi cao nhất trong 3 hạng</b></div>`}
function ticketDetailSheet(){const f=fare();const panels={benefits:`<div class="detail-benefit-grid"><div><span>Xách tay</span><b>${f.cabin}</b></div><div><span>Ký gửi</span><b class="${f.baggage.startsWith('Không')?'bad':''}">${f.baggage}</b></div><div><span>Đổi vé</span><b>${f.change}</b></div><div><span>Hoàn / huỷ</span><b class="${f.refund.startsWith('Không')?'bad':''}">${f.refund}</b></div></div>${fareCompareStrip()}`,baggage:`<div class="detail-policy"><b>Hành lý xách tay</b><p>${f.cabin}. Áp dụng theo giới hạn kích thước của hãng.</p><b>Hành lý ký gửi</b><p>${f.baggage}. Có thể mua thêm tại bước Dịch vụ bổ sung nếu hạng vé chưa bao gồm.</p></div>`,change:`<div class="detail-policy"><b>Đổi vé</b><p>${f.change}.</p><b>Hoàn / huỷ</b><p>${f.refund}.</p></div>`,conditions:`<div class="detail-policy"><b>Điều kiện vé</b><p>Thông tin hiển thị là bản tóm tắt giúp bạn ra quyết định. Điều kiện chi tiết phụ thuộc quy định hãng và thời điểm yêu cầu.</p><b>Chọn chỗ ngồi</b><p>Có thể chọn tại bước Dịch vụ bổ sung, có thể phát sinh phí.</p></div>`};return `<div class="sheet-wrap"><div class="sheet tall" data-draggable-sheet><div class="sheet-handle" data-sheet-handle></div><div class="sheet-head">Chi tiết vé<button class="sheet-close" data-close-sheet>×</button></div><div class="sheet-body"><div class="detail-flight-card"><div class="detail-carrier"><span class="wordmark">${airlineMark().word}</span><div><strong>${flight().airline}</strong><small>${flight().code} · ${fare().name}</small></div></div><div class="detail-route"><div><b>SGN</b><small>${flight().depart}</small></div><div class="route-center">${flight().duration}<span>✈</span><small>Bay thẳng</small></div><div><b>HAN</b><small>${flight().arrive}</small></div></div></div><div class="fare-tabs">${[['benefits','Quyền lợi'],['baggage','Hành lý'],['change','Đổi / Hoàn'],['conditions','Điều kiện']].map(x=>`<button class="fare-tab ${state.detailTab===x[0]?'active':''}" data-detail-tab="${x[0]}">${x[1]}</button>`).join('')}</div><div class="tab-panel">${panels[state.detailTab]}</div></div></div></div>`}
function seatMapSheet(){const seats=['12A','12B','12C','12D','12E','12F','13A','13B','13C','13D','13E','13F','14A','14B','14C','14D','14E','14F','15A','15B','15C','15D','15E','15F'];const taken=new Set(['12B','13D','15E']);return `<div class="sheet-wrap"><div class="sheet tall"><div class="sheet-handle"></div><div class="sheet-head">Chọn chỗ ngồi<button class="sheet-close" data-close-sheet>×</button></div><div class="sheet-body seat-map"><div class="seat-legend"><span><i class="legend-dot"></i>Còn trống</span><span><i class="legend-dot selected"></i>Đang chọn</span><span><i class="legend-dot taken"></i>Đã có người</span></div><div class="plane-shell"><div class="seat-grid"><span class="seat-label">A</span><span class="seat-label">B</span><span class="seat-label">C</span><span></span><span class="seat-label">D</span><span class="seat-label">E</span><span class="seat-label">F</span>${[12,13,14,15].map(r=>['A','B','C','aisle','D','E','F'].map(c=>c==='aisle'?'<span class="aisle"></span>':(()=>{const id=r+c;return `<button class="seat ${taken.has(id)?'taken':''} ${state.seat===id?'selected':''}" ${taken.has(id)?'disabled':''} data-seat="${id}">${id}</button>`})()).join('')).join('')}</div></div><button class="sheet-cta" data-confirm-seat>${state.seat?`Xác nhận ghế ${state.seat}`:'Chọn một ghế để tiếp tục'}</button></div></div></div>`}
function voucherSheet(){return `<div class="sheet-wrap"><div class="sheet voucher-sheet"><div class="sheet-handle"></div><div class="sheet-head">Ưu đãi cho chuyến bay<button class="sheet-close" data-close-sheet>×</button></div><div class="sheet-body"><div class="voucher-list">${Object.entries(vouchers).map(([k,v])=>{const active=state.voucher&&state.selectedVoucher===k;return `<div class="voucher-option ${active?'active':''}"><div class="voucher-option-top"><div class="voucher-ticket">%</div><div class="voucher-copy"><strong>${v.name}</strong><small>${v.condition}</small></div><div class="voucher-save">-${money(v.discount)}</div></div><div class="voucher-actions"><span>${active?'Đang áp dụng cho đơn này':'Có thể áp dụng cho đơn đủ điều kiện'}</span><button class="${active?'active':''}" data-select-voucher="${k}">${active?'Đang áp dụng':'Áp dụng'}</button></div></div>`}).join('')}</div></div></div></div>`}
function insuranceSheet(){const key=state.detailTab||'delay';const isDelay=key==='delay';return `<div class="sheet-wrap"><div class="sheet insurance-detail-sheet"><div class="sheet-handle"></div><div class="sheet-head">Điều khoản bảo hiểm<button class="sheet-close" data-close-sheet>×</button></div><div class="sheet-body"><h3>${isDelay?'Bảo hiểm trễ và huỷ chuyến':'Bảo hiểm du lịch'}</h3><p>Quyền lợi minh hoạ giúp bạn hiểu nhanh phạm vi bảo vệ trước khi mua.</p><ul class="terms-list">${isDelay?'<li>Bồi thường khi chuyến bay trễ trên 2 giờ theo điều kiện.</li><li>Hỗ trợ khi chuyến bay bị huỷ.</li><li>Không áp dụng cho sự kiện đã biết trước khi mua bảo hiểm.</li>':'<li>Hỗ trợ tai nạn trong chuyến đi.</li><li>Hỗ trợ hành lý thất lạc theo điều kiện.</li><li>Mức chi trả phụ thuộc hồ sơ và điều khoản nhà cung cấp.</li>'}</ul><div class="insurance-provider">BẢO VIỆT</div><div class="disclaimer">Đây là nội dung minh hoạ cho prototype, không thay thế quy tắc và điều khoản bảo hiểm chính thức.</div></div></div></div>`}
function confirmSheet(){return `<div class="sheet-wrap"><div class="sheet tall confirm-sheet" data-draggable-sheet><div class="sheet-handle" data-sheet-handle></div><div class="sheet-head">Xác nhận đặt chỗ<button class="sheet-close" data-close-sheet>×</button></div><div class="sheet-body"><div class="warning"><b>Bạn không thể thay đổi một số thông tin sau khi xác nhận.</b><br>Kiểm tra kỹ tên hành khách, chuyến bay và quyền lợi vé trước khi tiếp tục.</div><div class="confirm-flight-hero"><div class="airline-mark">${airlineMark().word}</div><div class="confirm-route-line"><div><span>SGN</span><b>${flight().depart}</b></div><div class="route-plane">✈<small>${flight().duration} · Bay thẳng</small></div><div><span>HAN</span><b>${flight().arrive}</b></div></div><div class="confirm-flight-meta"><strong>${flight().airline} · ${flight().code}</strong><span>${fare().name}</span></div></div><div class="confirm-key-grid"><div><span>Hành lý</span><b>${fare().cabin}</b><small>${fare().baggage}</small></div><div><span>Đổi vé</span><b>${fare().change}</b></div><div><span>Hoàn / huỷ</span><b>${fare().refund}</b></div><div><span>Dịch vụ</span><b>${selectedServices()}</b></div></div><div class="confirm-person"><div class="avatar">KD</div><div><span>Hành khách</span><b>${state.passenger.name}</b><small>${state.passenger.dob} · CCCD ${state.passenger.id}</small></div></div><div class="confirm-contact"><span>Thông tin liên hệ</span><b>${state.contact.phone}</b><small>${state.contact.email}</small></div><div class="confirm-price"><span>Tổng tạm tính</span><b>${money(farePrice()+addonPrice()+insurancePrice())}</b></div><div class="consent">Bằng cách nhấn <b>Xác nhận đặt chỗ</b>, bạn xác nhận thông tin trên là chính xác và đồng ý với điều kiện vé, điều khoản dịch vụ và chính sách liên quan.</div><button class="sheet-cta" data-confirm-booking>Xác nhận đặt chỗ</button></div></div></div>`}
function selectedServices(){const a=[];if(state.meal)a.push('Suất ăn');if(state.baggage)a.push(`${state.baggage}kg hành lý`);if(state.seat)a.push(`Ghế ${state.seat}`);if(state.insurance)a.push(state.insurance==='delay'?'Bảo hiểm trễ/huỷ':'Bảo hiểm du lịch');return a.length?a.join(' · '):'Chưa chọn dịch vụ bổ sung'}
function retentionSheet(){return `<div class="sheet-wrap"><div class="sheet retention-sheet"><div class="sheet-handle"></div><div class="sheet-head">Đơn hàng chưa hoàn tất<button class="sheet-close" data-close-sheet>×</button></div><div class="sheet-body"><div class="retention-icon">⌛</div><h3>Đừng bỏ lỡ ưu đãi của bạn</h3><p>Voucher và giá ưu đãi có thể hết hạn nếu bạn rời bước thanh toán.</p><div class="retention-box"><strong>Đang tiết kiệm ${money(discount())}</strong><small>Đơn hàng còn được giữ trong <b data-exit-timer>${longClock(state.bookingSeconds)}</b>. Thanh toán trong thời gian này để tăng khả năng giữ giá và mã khuyến mãi.</small></div><div class="exit-actions"><button class="stay" data-close-sheet>Tiếp tục thanh toán</button><button class="leave" data-leave-payment>Rời đi</button></div></div></div></div>`}
function thinkSheet(){return `<div class="sheet-wrap"><div class="sheet retention-sheet"><div class="sheet-handle"></div><div class="sheet-head">Chờ thanh toán<button class="sheet-close" data-close-sheet>×</button></div><div class="sheet-body"><div class="retention-icon">✈</div><h3>Bạn muốn suy nghĩ thêm?</h3><p>Vé đã được lưu ở trạng thái <b>Chờ thanh toán</b> trong Vé của tôi.</p><div class="retention-box"><strong>Vui lòng thanh toán trong <span data-exit-timer>${longClock(state.bookingSeconds)}</span></strong><small>Giá và mã khuyến mãi chỉ được giữ trong thời gian hệ thống cho phép. Sau đó giá có thể thay đổi.</small></div><div class="exit-actions"><button class="stay" data-resume-payment>Quay lại thanh toán</button><button class="leave" data-go-home>Về trang Vé máy bay</button></div></div></div></div>`}
function render(){renderFlow();const fn={home:renderHome,promo:renderPromo,search:renderSearch,passenger:renderPassenger,services:renderServices,payment:renderPayment,success:renderSuccess}[state.screen]||renderHome;phone.innerHTML=fn();bind();updateBannerDom();bindDragSheets()}
function bind(){phone.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',back));phone.querySelectorAll('[data-header-menu]').forEach(b=>b.addEventListener('click',()=>toast('Prototype: mở tuỳ chọn mini app')));phone.querySelectorAll('[data-go-search]').forEach(b=>b.addEventListener('click',()=>transitionTo('search')));phone.querySelectorAll('[data-promo-banner]').forEach(b=>b.addEventListener('click',()=>direct('promo')));phone.querySelectorAll('[data-banner-dot]').forEach(b=>b.addEventListener('click',()=>{state.bannerIndex=+b.dataset.bannerDot;updateBannerDom()}));phone.querySelectorAll('[data-collect-promo]').forEach(b=>b.addEventListener('click',()=>{state.promoCollected=true;render();toast('Đã lưu ưu đãi vào mục Ưu đãi')}));phone.querySelectorAll('[data-open-fares]').forEach(b=>b.addEventListener('click',()=>{state.selectedFlight=b.dataset.openFares;state.fareLocked=false;state.modal='fare';render()}));phone.querySelectorAll('[data-open-detail]').forEach(b=>b.addEventListener('click',()=>{state.selectedFlight=b.dataset.openDetail;state.detailTab='benefits';state.modal='ticket';render()}));phone.querySelectorAll('[data-choose-fare]').forEach(b=>b.addEventListener('click',()=>{state.selectedFare=b.dataset.chooseFare;state.fareLocked=true;state.detailTab='benefits';render()}));phone.querySelectorAll('[data-fare-continue]').forEach(b=>b.addEventListener('click',()=>{state.fareLocked=true;state.modal=null;transitionTo('passenger')}));phone.querySelectorAll('[data-compare-fares]').forEach(b=>b.addEventListener('click',()=>{state.compareFares=!state.compareFares;render()}));phone.querySelectorAll('[data-detail-tab]').forEach(b=>b.addEventListener('click',()=>{state.detailTab=b.dataset.detailTab;render()}));phone.querySelectorAll('[data-open-ticket-detail]').forEach(b=>b.addEventListener('click',()=>{state.detailTab='benefits';state.modal='ticket';render()}));phone.querySelectorAll('[data-toggle-traveller]').forEach(b=>b.addEventListener('click',()=>{state.travellerSelected=!state.travellerSelected;if(state.travellerSelected){state.passenger={name:'LE NGUYEN KHANH DOAN',dob:'02/11/2003',id:'086303002476'}}else{state.passenger={name:'',dob:'',id:''}}render()}));phone.querySelectorAll('[data-add-traveller]').forEach(b=>b.addEventListener('click',()=>{state.travellerSelected=false;state.passenger={name:'',dob:'',id:''};render()}));phone.querySelectorAll('[data-passenger-field]').forEach(i=>i.addEventListener('input',()=>{state.passenger[i.dataset.passengerField]=i.value}));phone.querySelectorAll('[data-contact-field]').forEach(i=>i.addEventListener('input',()=>{state.contact[i.dataset.contactField]=i.value}));phone.querySelectorAll('[data-next-services]').forEach(b=>b.addEventListener('click',()=>{const ids=['nameInput','dobInput','idInput'];if(!ids.every(id=>phone.querySelector('#'+id)?.value.trim())){toast('Vui lòng nhập đủ thông tin hành khách');return}state.travellerSelected=true;transitionTo('services')}));phone.querySelectorAll('[data-service]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.service;state.activeService=state.activeService===k?null:k;render()}));phone.querySelectorAll('[data-toggle-service]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.toggleService;state[k]=!state[k];render()}));phone.querySelectorAll('[data-baggage-option]').forEach(b=>b.addEventListener('click',()=>{const kg=+b.dataset.baggageOption;state.baggage=state.baggage===kg?0:kg;render()}));phone.querySelectorAll('[data-open-seatmap]').forEach(b=>b.addEventListener('click',()=>{state.modal='seat';render()}));phone.querySelectorAll('[data-seat]').forEach(b=>b.addEventListener('click',()=>{state.seat=b.dataset.seat;render()}));phone.querySelectorAll('[data-confirm-seat]').forEach(b=>b.addEventListener('click',()=>{if(!state.seat){toast('Vui lòng chọn ghế');return}state.modal=null;render()}));phone.querySelectorAll('[data-insurance]').forEach(b=>b.addEventListener('click',()=>{state.insurance=state.insurance===b.dataset.insurance?null:b.dataset.insurance;render()}));phone.querySelectorAll('[data-insurance-details]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();state.detailTab=b.dataset.insuranceDetails;state.modal='insurance';render()}));phone.querySelectorAll('[data-next-confirm]').forEach(b=>b.addEventListener('click',()=>showConfirmLoader()));phone.querySelectorAll('[data-confirm-booking]').forEach(b=>b.addEventListener('click',()=>{state.modal=null;transitionTo('payment')}));phone.querySelectorAll('[data-total-breakdown]').forEach(b=>b.addEventListener('click',()=>{if(state.screen==='payment'){state.priceBreakdown=!state.priceBreakdown;render()}else{state.modal='breakdown';render()}}));phone.querySelectorAll('[data-toggle-xu]').forEach(b=>b.addEventListener('click',()=>{state.useXu=!state.useXu;render()}));phone.querySelectorAll('[data-toggle-voucher]').forEach(b=>b.addEventListener('click',()=>{state.voucher=!state.voucher;render()}));phone.querySelectorAll('[data-open-vouchers]').forEach(b=>b.addEventListener('click',()=>{state.modal='voucher';render()}));phone.querySelectorAll('[data-select-voucher]').forEach(b=>b.addEventListener('click',()=>{state.selectedVoucher=b.dataset.selectVoucher;state.voucher=true;state.modal=null;render();toast('Đã áp dụng '+vouchers[state.selectedVoucher].name)}));phone.querySelectorAll('[data-method]').forEach(b=>b.addEventListener('click',()=>{state.paymentMethod=b.dataset.method;render()}));phone.querySelectorAll('[data-payment-exit]').forEach(b=>b.addEventListener('click',()=>{state.modal='exit';render()}));phone.querySelectorAll('[data-leave-payment]').forEach(b=>b.addEventListener('click',()=>{state.modal='think';state.screen='services';state.pendingBooking=true;render()}));phone.querySelectorAll('[data-resume-payment]').forEach(b=>b.addEventListener('click',()=>{state.modal=null;transitionTo('payment')}));phone.querySelectorAll('[data-go-home]').forEach(b=>b.addEventListener('click',()=>{state.modal=null;direct('home')}));phone.querySelectorAll('[data-pay-success]').forEach(b=>b.addEventListener('click',()=>transitionTo('success')));phone.querySelectorAll('[data-view-ticket]').forEach(b=>b.addEventListener('click',()=>toast('Prototype: mở Vé của tôi')));phone.querySelectorAll('[data-reset]').forEach(b=>b.addEventListener('click',reset));phone.querySelectorAll('[data-close-sheet]').forEach(b=>b.addEventListener('click',()=>{state.modal=null;render()}));phone.querySelectorAll('[data-airline-filter]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.airlineFilter;const has=state.selectedAirlines.includes(key);if(has&&state.selectedAirlines.length===1){toast('Cần chọn ít nhất 1 hãng bay');return}state.selectedAirlines=has?state.selectedAirlines.filter(x=>x!==key):[...state.selectedAirlines,key];render()}));phone.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{const tool=b.dataset.tool;if(tool==='deal'){state.modal='voucher';render();return}if(tool==='sort'){state.sortMode=state.sortMode==='recommended'?'priceAsc':'recommended';render();toast(state.sortMode==='recommended'?'Sắp xếp: Phù hợp nhất':'Sắp xếp: Giá thấp đến cao');return}state.filterMode='default';state.selectedAirlines=['VJ','VN','SP'];render();toast('Bộ lọc mặc định: tất cả hãng bay')}));phone.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.demo)))}
function updateBannerDom(){const track=phone.querySelector('.promo-track');if(track)track.style.transform=`translateX(-${state.bannerIndex*100}%)`;phone.querySelectorAll('.promo-dot').forEach((d,i)=>d.classList.toggle('active',i===state.bannerIndex))}
function bindDragSheets(){phone.querySelectorAll('[data-sheet-handle]').forEach(handle=>{const sheet=handle.closest('[data-draggable-sheet]');if(!sheet)return;let startY=0,startH=0;const move=e=>{const y=e.touches?e.touches[0].clientY:e.clientY;const delta=startY-y;const max=phone.clientHeight*.92,min=phone.clientHeight*.48;sheet.style.maxHeight=Math.max(min,Math.min(max,startH+delta))+'px'};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('touchmove',move);window.removeEventListener('touchend',up)};handle.addEventListener('pointerdown',e=>{startY=e.clientY;startH=sheet.getBoundingClientRect().height;window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)});handle.addEventListener('touchstart',e=>{startY=e.touches[0].clientY;startH=sheet.getBoundingClientRect().height;window.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',up)},{passive:true})})}
function reset(){state=initial();render()}
resetBtn.addEventListener('click',reset);flowList.addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(!b)return;const dest=b.dataset.jump;if(['passenger','services','payment','success'].includes(dest)){state.selectedFlight='f2';state.selectedFare='eco';state.fareLocked=true}state.screen=dest;state.modal=null;render()});
setInterval(()=>{if(state.screen==='home'){state.bannerIndex=(state.bannerIndex+1)%3;updateBannerDom()}},2000);
setInterval(()=>{if(state.bookingSeconds>0)state.bookingSeconds--;phone.querySelectorAll('[data-booking-timer]').forEach(x=>x.textContent=`Giữ chỗ ${longClock(state.bookingSeconds)}`);phone.querySelectorAll('[data-exit-timer]').forEach(x=>x.textContent=longClock(state.bookingSeconds))},1000);
render();
})();
</script>
</body>
</html>
